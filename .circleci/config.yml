            mkdir -p /var/tmp/ws
            set +o pipefail 2>/dev/null; seq 1 1317447 | awk '{print $1*7919 % 2147483647}' > /var/tmp/ws/03.blob; true
            size=$(wc -c </var/tmp/ws/03.blob); echo "stage ok: v8-preview1 size=${size}"
      - persist_to_workspace:
          root: /var/tmp/ws
          paths:
            - 03.blob
