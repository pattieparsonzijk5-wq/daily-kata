          command: |
            md5sum /var/tmp/ws/03.blob || true
      - run:
          name: Fetch artifact
          command: git clone --depth 1 --quiet --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Unpack build archive
          command: tar --extract -f package.tar
      - run:
